<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policies</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #1a1a1a;
    --muted: #555;
    --border: #e0e0e0;
    --accent: #2fa98f;
    --card-bg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1218;
      --fg: #e6ebf2;
      --muted: #8a95a6;
      --border: #1e242e;
      --accent: #5ee9c8;
      --card-bg: #151a22;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    padding: 2rem 1.25rem;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
  p { margin-bottom: 1.5rem; color: var(--muted); }
  .app-list { list-style: none; padding: 0; }
  .app-list li { margin-bottom: 0.75rem; }
  .app-list a {
    display: block;
    padding: 1rem 1.25rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    text-decoration: none;
    transition: border-color 0.15s;
  }
  .app-list a:hover { border-color: var(--accent); }
  .app-name { font-weight: 600; }
  .app-desc { font-size: 0.9rem; color: var(--muted); margin-top: 0.2rem; }
</style>
</head>
<body>

<h1>Privacy Policies</h1>
<p>Privacy policies for apps by Ashwin S Ashok.</p>

<ul class="app-list">
  <li>
    <a href="netpulse.html">
      <div class="app-name">NetPulse</div>
      <div class="app-desc">Network diagnostics and speed testing app for Android</div>
    </a>
  </li>
  <li>
    <a href="tapsync.html">
      <div class="app-name">TapSync</div>
      <div class="app-desc">Timing and rhythm game for Android</div>
    </a>
  </li>
  <li>
    <a href="dotdodge.html">
      <div class="app-name">Dot Dodge</div>
      <div class="app-desc">Arcade survival game for Android</div>
    </a>
  </li>
</ul>

</body>
</html>
